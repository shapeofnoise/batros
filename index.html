<!DOCTYPE html>
<html>
<head>
<title>2x2 Live Screensaver</title>
<style>
  /* Basic Reset */
  body, html { 
    margin: 0; 
    padding: 0; 
    width: 100%; 
    height: 100%; 
    overflow: hidden; 
    background-color: #000; 
  }

  /* The Grid Container configured for 2x2 */
  .grid-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    width: 100vw;
    height: 100vh;
  }

  /* Iframe Styling */
  iframe { 
    width: 100%; 
    height: 100%; 
    border: none; 
    pointer-events: none; /* Disables clicking so the mouse doesn't get stuck */
  }
</style>
</head>
<body>

  <!-- The container is empty now; JavaScript will fill it -->
  <div class="grid-container" id="videoGrid"></div>

<script>
  // --- CONFIGURATION ---
  // Array configured with 4 video IDs. Replace these with your chosen IDs.
  const videoIds = [
    "Mm_zVDDUeNA",  // batros!
    "Ziu0WsWAukE",  // puffin
    "-qvYCbvbeN8",  // ospre
    "-m_nQT62B4Y"   // kat
  ];

  // --- LOGIC ---
  const container = document.getElementById('videoGrid');

  videoIds.forEach(id => {
    const iframe = document.createElement('iframe');
    let src = "";

    if (id.startsWith("UC")) {
        // CHANNEL LIVE STREAM
        src = `https://www.youtube.com/embed/live_stream?channel=${id}&autoplay=1&mute=1`;
    } else {
        // SPECIFIC VIDEO LOOP (looping requires playlist parameter)
        src = `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}`;
    }
    
    iframe.src = src;
    iframe.allow = "autoplay; encrypted-media";
    iframe.referrerPolicy = "strict-origin-when-cross-origin";
    iframe.allowFullscreen = true;

    container.appendChild(iframe);
  });
</script>

</body>
</html>
