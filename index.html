<!DOCTYPE html>
<html>
<head>
<title>3x3 Live Screensaver</title>
<style>
  /* Basic Reset */
  body, html { 
    margin: 0; 
    padding: 0; 
    width: 100%; 
    height: 100%; 
    overflow: hidden; 
    background-color: #000; 
  }

  /* The Grid Container */
  .grid-container {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr; /* 3 Columns */
    grid-template-rows: 1fr 1fr 1fr;    /* 3 Rows */
    width: 100vw;
    height: 100vh;
  }

  /* Iframe Styling */
  iframe { 
    width: 100%; 
    height: 100%; 
    border: none; 
    pointer-events: none; /* Disables clicking so screensaver doesn't get stuck */
  }
</style>
</head>
<body>

  <!-- The container is empty now; JavaScript will fill it -->
  <div class="grid-container" id="videoGrid"></div>

<script>
  // --- CONFIGURATION: EDIT YOUR VIDEO IDS HERE ---
  // Just paste the 11-character ID inside the quotes.
  // The order here determines the order on screen (Left->Right, Top->Bottom).
  const videoIds = [
    "Mm_zVDDUeNA",  // 1. Батрос
    "BfGL7A2YgUY",  // 2. Какапо
    "Lm5hlCYowI4",  // 3. Строит
    "CLDRylX38mw",  // 4. Кот
    "-m_nQT62B4Y",  // 5. Кэт
    "FPd_RbADE48",  // 6. Ыова
    "TA6vV8bkhc8",  // 7. рлы 2
    "Lo1l2aD-CCo",  // 8. Орал
    "d1BxdM03bDc"   // 9. Сов
  ];

  // --- LOGIC: DO NOT EDIT BELOW THIS LINE ---
  const container = document.getElementById('videoGrid');

  videoIds.forEach(id => {
    // Create the iframe element
    const iframe = document.createElement('iframe');

    // Construct the URL dynamically
    // We insert the 'id' variable twice: once for the video, once for the playlist loop
    iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0&rel=0&showinfo=0&modestbranding=1&loop=1&playlist=${id}&iv_load_policy=3`;
    
    // Set required security and autoplay attributes
    iframe.allow = "autoplay; encrypted-media";
    iframe.referrerPolicy = "strict-origin-when-cross-origin";
    iframe.allowFullscreen = true;

    // Add it to the grid
    container.appendChild(iframe);
  });
</script>

</body>
</html>
