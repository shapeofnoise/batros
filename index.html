<!DOCTYPE html>
<html>
<head>
<title>4x4 Live Screensaver</title>
<style>
  /* Basic Reset */
  body, html { 
    margin: 0; 
    padding: 0; 
    width: 100%; 
    height: 100%; 
    overflow: hidden; 
    background-color: #000; 
  }

  /* The Grid Container */
  .grid-container {
    display: grid;
    /* UPDATED: Create 4 columns of equal width */
    grid-template-columns: repeat(4, 1fr);
    /* UPDATED: Create 4 rows of equal height */
    grid-template-rows: repeat(4, 1fr);
    width: 100vw;
    height: 100vh;
  }

  /* Iframe Styling */
  iframe { 
    width: 100%; 
    height: 100%; 
    border: none; 
    pointer-events: none; /* Disables clicking so the mouse doesn't get stuck */
  }
</style>
</head>
<body>

  <!-- The container is empty now; JavaScript will fill it -->
  <div class="grid-container" id="videoGrid"></div>

<script>
  // --- CONFIGURATION ---
  // We now need 16 IDs for a full 4x4 grid.
  const videoIds = [
    "Mm_zVDDUeNA",  // 1
    "BfGL7A2YgUY",  // 2
    "UCVdpXl0rxsYEst6PGS5fCIA",  // 3 (Channel)
    "CLDRylX38mw",  // 4
    "-m_nQT62B4Y",  // 5
    "s0liN8AzykQ",  // 6
    "TA6vV8bkhc8",  // 7
    "Lo1l2aD-CCo",  // 8
    "OAH9wuZRJoY",  // 9
    "OAH9wuZRJoY",  // 10 (Repeat/Placeholder)
    "OAH9wuZRJoY",  // 11 (Repeat/Placeholder)
    "OAH9wuZRJoY",  // 12 (Repeat/Placeholder)
    "OAH9wuZRJoY",  // 13 (Repeat/Placeholder)
    "OAH9wuZRJoY",  // 14 (Repeat/Placeholder)
    "OAH9wuZRJoY",  // 15 (Repeat/Placeholder)
    "OAH9wuZRJoY"   // 16 (Repeat/Placeholder)
  ];

  // --- LOGIC ---
  const container = document.getElementById('videoGrid');

  videoIds.forEach(id => {
    const iframe = document.createElement('iframe');
    let src = "";

    if (id.startsWith("UC")) {
        // CHANNEL LIVE STREAM
        src = `https://www.youtube.com/embed/live_stream?channel=${id}&autoplay=1&mute=1&rel=0`;
    } else {
        // SPECIFIC VIDEO LOOP
        src = `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}&rel=0`;
    }
    
    iframe.src = src;
    iframe.allow = "autoplay; encrypted-media";
    iframe.referrerPolicy = "strict-origin-when-cross-origin";
    iframe.allowFullscreen = true;

    container.appendChild(iframe);
  });
</script>

</body>
</html>
