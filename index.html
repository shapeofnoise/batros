<!DOCTYPE html>
<html>
<head>
<title>3x3 Live Screensaver</title>
<style>
  /* Basic Reset */
  body, html { 
    margin: 0; 
    padding: 0; 
    width: 100%; 
    height: 100%; 
    overflow: hidden; 
    background-color: #000; 
  }

  /* The Grid Container */
  .grid-container {
    display: grid;
    /* Create 3 columns of equal width */
    grid-template-columns: 1fr 1fr 1fr;
    /* Create 3 rows of equal height */
    grid-template-rows: 1fr 1fr 1fr;
    width: 100vw;
    height: 100vh;
  }

  /* Iframe Styling */
  iframe { 
    width: 100%; 
    height: 100%; 
    border: none; 
    pointer-events: none; /* Disables clicking */
  }
</style>
</head>
<body>

  <div class="grid-container">
    <!-- Row 1 -->
    <!-- 1. Albatross -->
    <iframe src="https://www.youtube.com/embed/Mm_zVDDUeNA?autoplay=1&mute=1&controls=0&rel=0&showinfo=0&modestbranding=1&loop=1&playlist=Mm_zVDDUeNA&iv_load_policy=3" 
            allow="autoplay; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
            
    <!-- 2. Shark Cam -->
    <iframe src="https://www.youtube.com/embed/BfGL7A2YgUY?autoplay=1&mute=1&controls=0&rel=0&showinfo=0&modestbranding=1&loop=1&playlist=BfGL7A2YgUY&iv_load_policy=3" 
            allow="autoplay; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
