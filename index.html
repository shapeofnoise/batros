<!DOCTYPE html>
<html>
<head>
<title>3x3 Live Screensaver</title>
<style>
  /* Basic Reset */
  body, html { 
    margin: 0; 
    padding: 0; 
    width: 100%; 
    height: 100%; 
    overflow: hidden; 
    background-color: #000; 
  }

  /* The Grid Container */
  .grid-container {
    display: grid;
    /* Create 3 columns of equal width */
    grid-template-columns: 1fr 1fr 1fr;
    /* Create 3 rows of equal height */
    grid-template-rows: 1fr 1fr 1fr;
    width: 100vw;
    height: 100vh;
  }

  /* Iframe Styling */
  iframe { 
    width: 100%; 
    height: 100%; 
    border: none; 
    pointer-events: none; /* Disables clicking so the mouse doesn't get stuck */
  }
</style>
</head>
<body>

  <!-- The container is empty now; JavaScript will fill it -->
  <div class="grid-container" id="videoGrid"></div>

<script>
  // --- CONFIGURATION ---
  // 1. If ID starts with "UC" -> It plays the CHANNEL'S current live stream.
  // 2. If ID is normal (11 chars) -> It plays that SPECIFIC video on loop.
  
  const videoIds = [
    "Mm_zVDDUeNA",  // 1. Батрос
    "BfGL7A2YgUY",  // 2. Какапо
    "UCVdpXl0rxsYEst6PGS5fCIA",  // 3. Nest
    "CLDRylX38mw",  // 4. Кот
    "-m_nQT62B4Y",  // 5. Кэт
    "nYzRIKv5j44",  // 6. hum
    "TA6vV8bkhc8",  // 7. рлы 2
    "Lo1l2aD-CCo",  // 8. Орал
    "d1BxdM03bDc"   // 9. Сов
  ];

  // --- LOGIC: DO NOT EDIT BELOW THIS LINE ---
  const container = document.getElementById('videoGrid');

  videoIds.forEach(id => {
    const iframe = document.createElement('iframe');
    let src = "";

    // CHECK: Is this a Channel ID (starts with UC) or a Video ID?
    if (id.startsWith("UC")) {
        // IT IS A CHANNEL: Use the special "Live Stream" embed URL
        // This will automatically find the current live video for this channel.
        src = `https://www.youtube.com/embed/live_stream?channel=${id}&autoplay=1&mute=1&controls=0&showinfo=0&modestbranding=1`;
    } else {
        // IT IS A VIDEO: Use the standard embed URL with the playlist loop hack
        // We insert the 'id' variable twice: once for the video, once for the playlist loop
        src = `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0&rel=0&showinfo=0&modestbranding=1&loop=1&playlist=${id}&iv_load_policy=3`;
    }
    
    // Set source and security attributes
    iframe.src = src;
    iframe.allow = "autoplay; encrypted-media";
    iframe.referrerPolicy = "strict-origin-when-cross-origin";
    iframe.allowFullscreen = true;

    // Add it to the grid
    container.appendChild(iframe);
  });
</script>

</body>
</html>
